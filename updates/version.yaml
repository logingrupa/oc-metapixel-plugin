2.0.0:
    - v2.0.0 marketplace launch — generic-event-tracking adapter architecture, Shopaholic decoupled to suggest, Multisite credentials, TrustedHosts PSL allowlist, FailedEvents replay UI, ViewContent funnel at offer grain, MIT license.
2.0.1:
    - Release the 2.0.0 version.yaml entry in a tagged version - composer installs of v2.0.0 shipped version.yaml stuck at 1.0.4, making October report the db ahead of files.
2.0.2:
    - 'New metapixel.pixel.before_render hook - the request-time browser-twin counterpart of metapixel.event.before_dispatch. That hook fires in the CAPI queue job and never sees the custom_data a request-time fbq() block renders, so a listener mutating CAPI values (a margin rewrite, for example) desynced the browser twin on the same event_id. PixelRenderHook::apply now wraps the three content-carrying FbqScriptBuilder call sites (page-load collector blocks, the AddToCart mark, the offer-switch ViewContent); listeners receive the event name and custom_data by reference, event_id stays unexposed, contentless blocks skip the hook, and a throwing listener abstains with the unmutated block rendered.'
2.0.3:
  - 'Settings::lookupForSite reads all credential rows in one query keyed by site_id instead of three separate reads (default row, fallback, per-site). Same fresh-per-call semantics, two fewer queries on every page view.'
2.0.4:
  - 'Changelog doc tests normalize CRLF before matching: a Windows autocrlf checkout puts \r ahead of the newline, which the $/m regex anchors never match, so the suite ran red on Windows and green on the servers for months. Test-only change.'
2.0.5:
  - 'The hybrid AJAX offer-switch path loaded its Product twice: dispatchViaAdapter runs loadSubject for the 404 guard, then dispatchForOfferSwitch discarded that subject and ran the identical loadSubject again - two active-product reads plus two site_list pivot reads per family or shade switch beacon. The handler now forwards the validated subject and the watcher reuses it when it is the matching Product, reloading only for foreign callers. The adapter boundary is untouched: the theme handler stays free of Lovata imports, the instanceof check lives in the shopaholic watcher directory.'

2.0.6:
  - 'TOOL-10 user plugin decoupling guard: a test scans runtime sources and asserts no hard reference to Lovata.Buddies or RainLab.User classes. The plugin ships to shops running either user plugin and guarantees it by referencing neither - the CI matrix installs Buddies to prove the integration, this test pins the source-level decoupling on every host. Test-only, no runtime change.'

2.0.7:
  - 'The cookie middleware resolves _fbp / _fbc before the page runs and primes them into the request, so the ViewContent, PageView and AddToCart of the ad-click landing request send fbc instead of null, and a new fbclid replaces the stored _fbc like the browser pixel does. Both cookies are exempt from cookie encryption, which had nulled every Cookie facade read (PageView, Search and InitiateCheckout carried no fbp or fbc at all). Every CAPI event now carries event_source_url.'

2.0.8:
  - 'Crawler user agents (Googlebot, bingbot, DotBot, MJ12bot, facebookexternalhit, headless browsers, CLI tools) skip the CAPI pipeline before any send or log write; on a live shop they were 35 percent of all server events and never had a browser twin. The Graph client bounds connect time at 2 seconds and carries the curl cause in the error, so a failed event now says why (for example "Resolving timed out after 5001 milliseconds"). The Failed events screen warns while QUEUE_CONNECTION is sync, and the README documents the queue worker and the DNS resolver requirement.'

2.0.9:
  - 'Check dedup reads Meta''s Dataset Quality API (GET /dataset_quality?dataset_id=...&fields=web{event_name,event_match_quality,event_coverage}) instead of the pixel node, which every Events Manager token answers with "(#100) Missing Permission". EMQ comes from composite_score, the Dedup column from event coverage (the share of browser events matched with a server twin), since the API exposes no deduplication field. The unused test-event-code and event-id parameters are gone.'

2.1.0:
  - 'Customer identity on every event: the new metapixel.user_data.resolve hook fires once per request so the host supplies the visitor''s raw email, phone, name, city, zip, country and user id; the plugin hashes them into ViewContent, AddToCart, PageView and Search (adapter values win, so Purchase keeps the order data) and renders the same hashes as the browser pixel''s Advanced Matching object. Hasher normalisation now follows Meta''s per-field rules (phone digits without leading zeros, names without punctuation, compact city/zip, ISO alpha-2 country).'

2.1.1:
  - 'Built-in account identity listener: with the new Advanced setting on, the logged-in customer''s email, phone, name and user id are read through Lovata Toolbox UserHelper (RainLab.User or Lovata.Buddies) and hashed into every event, no host listener needed; a host listener still wins on the keys it fills. A phone country calling code setting prefixes 8-digit national numbers. The user_data.resolve hook no longer fires while the plugin is disabled or for a crawler user agent.'

2.1.2:
  - 'The built-in account identity listener calls the auth facade''s check() before reading the user, so the session user is loaded on the first user_data.resolve call of the request. Toolbox UserHelper::getUser() only returns the user the Laravel session guard already holds in memory; on a product page the ViewContent watcher asked first, before anything touched the guard, so the empty identity was memoised and the browser Advanced Matching object and every in-request CAPI event lost the logged-in customer.'
